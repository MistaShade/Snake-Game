<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Home.css">
    <script src="Home.js"></script>
    <title>Snake | Main Menu</title>
    <link rel="icon" href="SnakeGameLogo.png" type="image/png">
</head>
<body>
    <div class="main">
        <div class="ground">
            <div class="logo"></div>      
            <div class="buttonsandfruits">
                <div class="rowBaF">
                    <img src="apple.png" class="fruits" alt="apple fruit">
                    <a class="start" href='Snake.html'><button><img src="start.png" class="homepagebutton" alt="button"></button></a>
                    <img src="apple.png" class="fruits" alt="apple fruit">
                </div>
                <div class="rowBaF">
                    <img src="cherry.png" class="fruits" alt="fruit cherry">
                    <a class="settings"><button><img src="settings.png" class="homepagebutton" alt="button"></button></a>
                    <img src="cherry.png" class="fruits" ="fruit cherry">
                </div>
                <div class="rowBaF">
                    <img src="apple.png" class="fruits" alt="apple fruit">
                    <a class="high"><button><img src="highscore.png" class="homepagebutton" alt="button"></button></a>
                    <img src="apple.png" class="fruits" alt="apple fruit"> 
                </div>
                <div class="rowBaF">
                    <img src="cherry.png" class="fruits" alt="fruit cherry">
                    <a onclick="closeWindow()" class="quit"><button><img src="quit.png" class="homepagebutton" alt="button"></button></a>
                    <img src="cherry.png" class="fruits" alt="fruit cherry">
                </div>
            </div>
        </div>
    </div>

</html>
